# EC2 운영 서버용 구성 (소스 코드 없이 Docker Hub 이미지만 사용)
#   docker compose -f docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#   모니터링 포함: 위 명령에 --profile monitoring 추가

services:
  api:
    image: ${DOCKERHUB_USER:?DOCKERHUB_USER 를 .env 에 지정하세요}/drive-log-api:${IMAGE_TAG:-latest}
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "4173"
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${DOCKERHUB_USER}/drive-log-web:${IMAGE_TAG:-latest}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    restart: unless-stopped
    logging: *default-logging

  dozzle:
    image: amir20/dozzle:v8.12.3
    profiles: ["monitoring"]
    ports:
      - "${MONITOR_PORT:-9999}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
